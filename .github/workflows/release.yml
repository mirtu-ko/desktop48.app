name: Build & Release

on:
  push:
    tags:
      - 'v*' # 只有推送 v 开头的 tag 时才触发，例如 v1.0.0

permissions:
  contents: write

jobs:
  # 先创建 release，避免 matrix 并行 job 各自创建导致重复 release（竞态）
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # release 已存在时跳过创建，支持失败重跑和复用已有 release
        run: gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes

  release:
    needs: create-release # 等待 release 创建完成，后续 job 只上传产物
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # 这里定义你要构建的平台。
        # 注意：构建 macOS 需要 macOS 运行环境，构建 Windows 需要 Windows 环境
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 根据你的项目需求选择 Node 版本

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps # 当前依赖树包含 vite/electron-vite 的 peer 冲突，发布流程按本地安装方式忽略 peer 校验

      # 构建并发布
      # 这里的 GH_TOKEN 是 GitHub 自动生成的，无需手动设置
      - name: Build and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
